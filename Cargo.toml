[package]
name = "cfail"
description = "Simple in-line compile-fail tests"
version = "0.1.0"
edition = "2024"
license = "0BSD"
repository = "https://github.com/SludgePhD/cfail"
categories = ["development-tools::testing"]
rust-version = "1.88.0" # (keep this in sync with `ci.yaml`)

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(compile_fail)'] }

[[test]]
name = "cfail"
harness = false
